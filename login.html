<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SENAI CTTI</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header class="cabecalho-login">
        <a href="index.html" class="logo">
            <h2>SENAI <span>| CTTI</span></h2>
            <small>Centro de Treinamento da Tecnologia da Informação</small>
        </a>

        <a href="index.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>
            Voltar ao site
        </a>
    </header>

    <main class="pagina-login">
        <section class="caixa-login">

            <div class="icone-usuario">
                <i class="fa-solid fa-user"></i>
            </div>

            <h2>Bem-vindo de volta!</h2>

            <p class="subtitulo">
                Acesse sua área do aluno
            </p>

            <!-- Formulário apenas visual -->
            <form>

                <label for="email">E-mail</label>

                <div class="campo">
                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail">
                </div>

                <label for="senha">Senha</label>

                <div class="campo">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha">

                    <i class="fa-regular fa-eye"></i>
                </div>

                <div class="opcoes">
                    <label class="lembrar">
                        <input type="checkbox">
                        Lembrar de mim
                    </label>

                    <a href="#" class="esqueci">
                        Esqueci minha senha
                    </a>
                </div>

                <button type="button" class="botao-entrar">
                    Entrar na plataforma
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <p class="ajuda">
                Precisa de acesso?
                <a href="index.html#contato">Entre em contato</a>
            </p>

            <div class="separador"></div>

            <a href="index.html" class="link-inicio">
                <i class="fa-solid fa-house"></i>
                Voltar para a página inicial
            </a>

        </section>

    </main>

    <footer class="rodape-login">
        <p>Projeto educacional sobre o SENAI CTTI.</p>
    </footer>

</body>
</html>
